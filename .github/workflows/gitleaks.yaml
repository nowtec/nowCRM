name: Gitleaks Security Scan

# Temporarily disabled: no Gitleaks license available for the repository.
# Once a Gitleaks license is available, re-enable by restoring the pull_request/push triggers below.
on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - main
  # push:
  #   branches:
  #     - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
